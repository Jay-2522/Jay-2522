name: Update GitHub Streak

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Streak SVG
        run: |
          mkdir -p assets

          cat > assets/github-streak.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="800" height="220">
            <rect width="100%" height="100%" fill="#0d1117"/>
            <text x="50%" y="50%" text-anchor="middle"
              fill="#58a6ff"
              font-size="28"
              font-family="Arial">
              GitHub Streak Generator Active
            </text>
          </svg>
          EOF

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-streak.svg

          git diff --staged --quiet || git commit -m "Update streak SVG"

          git push
