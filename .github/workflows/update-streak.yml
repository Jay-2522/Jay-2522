name: Update GitHub Contribution Streak

on:
  schedule:
    - cron: "45 18 * * *" # Daily at 12:15 AM IST
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-streak.yml"
      - "scripts/generate_contribution_widgets.py"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: contribution-widgets
  cancel-in-progress: false

jobs:
  update-streak:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate streak SVG
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_USERNAME: Jay-2522
        run: python scripts/generate_contribution_widgets.py

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-streak.svg assets/github-streak-v2.svg
          if git diff --cached --quiet; then
            echo "Contribution streak SVG is already current."
            exit 0
          fi
          git commit -m "Update GitHub contribution streak"
          git push
