<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="430" viewBox="0 0 1500 430" role="img" aria-labelledby="title desc">
  <title id="title">Hey, I’m Virlanki Jaidheep</title>
  <desc id="desc">A red and black profile banner for a full-stack developer and AI and machine learning enthusiast.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050506"/>
      <stop offset="0.52" stop-color="#0b0b0f"/>
      <stop offset="1" stop-color="#150306"/>
    </linearGradient>
    <linearGradient id="redLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff1f32" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#ff1f32"/>
      <stop offset="1" stop-color="#8b0010" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff2035" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ff2035" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="1496" height="426" rx="28" fill="url(#background)" stroke="#64101b" stroke-width="4" filter="url(#shadow)"/>
  <ellipse cx="180" cy="65" rx="330" ry="230" fill="url(#glow)" filter="url(#softGlow)"/>
  <ellipse cx="1350" cy="390" rx="390" ry="235" fill="url(#glow)" filter="url(#softGlow)" opacity="0.7"/>

  <path d="M-35 330 C210 40 420 15 690 148 C920 260 1135 225 1535 10" fill="none" stroke="#5b0b15" stroke-width="54" opacity="0.32"/>
  <path d="M-50 345 C210 55 425 30 690 160 C920 272 1140 235 1550 20" fill="none" stroke="url(#redLine)" stroke-width="3"/>
  <path d="M-60 374 C205 105 438 72 695 190 C935 300 1180 260 1555 65" fill="none" stroke="#c31425" stroke-width="2" opacity="0.45"/>
  <path d="M-40 397 C250 164 470 130 720 225 C965 318 1180 300 1540 125" fill="none" stroke="#ff2438" stroke-width="1.5" opacity="0.28"/>

  <g transform="translate(750 92)">
    <path d="M-83 0 H83 L62 14 H-62 Z" fill="#ff2034" opacity="0.95"/>
    <path d="M-55 22 H55 L40 32 H-40 Z" fill="#a90f20" opacity="0.9"/>
  </g>

  <text x="390" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="700" fill="#f0f3f6">Hey, I’m</text>
  <text x="636" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="700" fill="#ff2438">Virlanki Jaidheep</text>
  <rect x="704" y="214" width="92" height="5" rx="2.5" fill="#ff2438"/>
  <text x="750" y="269" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="500" fill="#c7cbd2" letter-spacing="0.8">Full-Stack Developer  ·  AI/ML Enthusiast  ·  Problem Solver</text>
  <text x="750" y="323" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" fill="#aeb4be">Building scalable, intelligent products for real-world problems.</text>

  <g transform="translate(518 353)">
    <rect width="464" height="48" rx="24" fill="#12080b" stroke="#7d1723" stroke-width="2"/>
    <circle cx="30" cy="24" r="6" fill="#ff2438"/>
    <text x="58" y="31" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#e5e7eb">CODE  ·  BUILD  ·  IMPROVE  ·  REPEAT</text>
  </g>
